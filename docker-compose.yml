
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./config:/app/config
      - ./logs:/var/log
      - ./.env:/app/.env
      - ./vendor:/app/vendor
      - ./composer.json:/app/composer.json
      - ./composer.lock:/app/composer.lock
    environment:
      - APP_ENV=${APP_ENV:-development}
    restart: unless-stopped
    networks:
      - biconnector
      - shared_db_network

  # ClickHouse source used by the integration test suite
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      # Bound to the loopback interface: the source is reachable from the host test run only.
      # The published port is not the ClickHouse default one, which a local source of a developer
      # commonly holds already; override it with CLICKHOUSE_HOST_PORT when 8124 is taken as well.
      - "127.0.0.1:${CLICKHOUSE_HOST_PORT:-8124}:8123"
    environment:
      - CLICKHOUSE_DB=bi_test
      - CLICKHOUSE_USER=bi_test
      - CLICKHOUSE_PASSWORD=bi_test_password
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - biconnector
    profiles:
      - test

  # Service for running tests
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./:/app
    working_dir: /app
    command: vendor/bin/phpunit
    environment:
      - APP_ENV=testing
    networks:
      - biconnector
    profiles:
      - test

  # Service for running PHPStan
  phpstan:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./:/app
    working_dir: /app
    command: vendor/bin/phpstan analyse src --level=8 --memory-limit=512M
    networks:
      - biconnector
    profiles:
      - lint

  # Service for running PHP_CodeSniffer
  phpcs:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./:/app
    working_dir: /app
    command: vendor/bin/phpcs src --standard=PSR12
    networks:
      - biconnector
    profiles:
      - lint

  # Service for auto-fixing code style
  phpcbf:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./:/app
    working_dir: /app
    command: vendor/bin/phpcbf src --standard=PSR12
    networks:
      - biconnector
    profiles:
      - lint

networks:
  biconnector:
    driver: bridge
  shared_db_network:
    external: true
